<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>RadarPrix — Les meilleures offres, détectées automatiquement</title>
    <meta
      name="description"
      content="RadarPrix compare en continu les prix des marchands français et fait remonter les meilleures offres du moment : promotions, codes de réduction, produits offerts et baisses de prix inhabituelles. Alertes par email sur les produits suivis."
    />
    <link rel="canonical" href="https://radarprix-frontend.vercel.app/" />

    <!--
      Vérification de propriété Awin. Le réseau demande de faire figurer la
      mention « Awin » dans le code source du site pour confirmer que le
      demandeur est bien propriétaire de l'espace publicitaire déclaré — ce
      qui accélère le traitement du dossier d'éditeur.

      À conserver tant que le compte éditeur est actif : la vérification peut
      être rejouée lors d'un contrôle de conformité, et une balise retirée
      ferait échouer ce contrôle.
    -->
    <meta name="awin-site-verification" content="RadarPrix — espace publicitaire déclaré auprès d'Awin" />

    <!--
      Balises Open Graph / Twitter : ce sont elles qui remplissent l'aperçu
      quand un lien est collé sur WhatsApp, Discord, X, Slack…

      Elles sont écrites en dur ici, et pas injectées par React, parce que les
      robots des réseaux sociaux n'exécutent pas le JavaScript : ils ne lisent
      que le HTML servi tel quel. Toutes les pages de l'application partagent
      donc le même aperçu. Afficher le vrai produit dans l'aperçu d'un lien
      ?produit=... demanderait un pré-rendu ou du rendu serveur — non fait
      pour l'instant, mais c'est déjà mieux qu'un aperçu totalement vide.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RadarPrix" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://radarprix-frontend.vercel.app/" />
    <meta property="og:title" content="Le bon prix, avant tout le monde." />
    <meta
      property="og:description"
      content="Les meilleures offres chez les marchands français, repérées automatiquement."
    />
    <meta property="og:image" content="https://radarprix-frontend.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RadarPrix — le bon prix, avant tout le monde." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Le bon prix, avant tout le monde." />
    <meta
      name="twitter:description"
      content="Les meilleures offres chez les marchands français, repérées automatiquement."
    />
    <meta name="twitter:image" content="https://radarprix-frontend.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
